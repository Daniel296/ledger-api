spring:
  application:
    name: ledger-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query:
          fail_on_pagination_over_collection_fetch: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
