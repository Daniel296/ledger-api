spring:
  application:
    name: ledger-api
  datasource:
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  kafka:
    producer:
      properties:
        linger.ms: 0
        max.block.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
