asyncapi: 3.0.0
info:
  title: Ledger announcements
  version: 1.0.0
  description: |
    The messages the ledger publishes on Kafka. Every recorded transaction, reversals included, is
    announced after it is committed, as the same `Transaction` the REST API returns for
    `GET /v1/transactions/{transactionId}` (docs/openapi.yaml).

    What a consumer can rely on:
    - Nothing is missed. The message is written to an outbox table in the database transaction that
      records the transaction, and published after the commit. A committed transaction is announced
      even when the instance that recorded it crashes right after the commit, or Kafka is down for a
      while: its message waits in the outbox until it can be published. A refused transaction is never
      announced.
    - A message may arrive more than once (at-least-once delivery): a publisher that stops after Kafka
      acknowledged a message but before it noted it as sent sends it again. The copy is identical
      (same key, same body). Deduplicate on the transaction `id`, which is also the message key.
    - Order: the topic has one partition and one instance publishes at a time, in the order the
      transactions were recorded. Two transactions that touch the same account arrive in the order
      they were applied to it, and a reversal always arrives after the transaction it reverses.
      Transactions with no account in common may arrive in either order. A copy always repeats a
      message that already arrived, so once copies are dropped the order holds.
    - Delay: a transaction is usually announced well within a second of its commit; while Kafka is
      down, messages wait in the outbox and are published, in order, once it is back.
    - Evolution: within version 1, changes are additive only (new optional fields); consumers must
      ignore fields they do not know. A breaking change would get a new topic.
defaultContentType: application/json

servers:
  docker:
    host: kafka:9092
    protocol: kafka
    description: The broker docker-compose.yml starts, inside its network.

channels:
  transactionRecorded:
    address: transaction-recorded
    description: One message for every recorded transaction or reversal.
    messages:
      transactionRecorded:
        $ref: '#/components/messages/TransactionRecorded'
    bindings:
      kafka:
        partitions: 1
        bindingVersion: 0.5.0

operations:
  announceTransactionRecorded:
    action: send
    summary: Announce a recorded transaction
    channel:
      $ref: '#/channels/transactionRecorded'
    messages:
      - $ref: '#/channels/transactionRecorded/messages/transactionRecorded'

components:
  messages:
    TransactionRecorded:
      name: transaction-recorded
      title: Transaction recorded
      contentType: application/json
      payload:
        $ref: './openapi.yaml#/components/schemas/Transaction'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: The id of the transaction.
          bindingVersion: 0.5.0
      examples:
        - name: payout
          summary: Merchant 42 is paid out 98.50 EUR, with a fee of 1.50
          payload:
            id: 3f1c9a2e-8b4d-4e6f-9a1b-2c3d4e5f6a7b
            description: Payout to Merchant 42
            currency: EUR
            entries:
              - accountId: 0b5e3a52-6d1c-4f0e-9a43-7c1f4f2d8a10
                direction: DEBIT
                amount: '100.00'
              - accountId: 5f8c2d71-1e4b-4a9e-8b2f-3d6a9c0e7b21
                direction: CREDIT
                amount: '98.50'
              - accountId: 9a1d4e63-2b7f-4c8a-a5e0-6f3b8d2c1e94
                direction: CREDIT
                amount: '1.50'
            recordedAt: '2026-11-10T14:30:00.123456Z'
