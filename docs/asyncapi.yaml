asyncapi: 3.0.0
info:
  title: Ledger messages
  version: 1.0.0
  description: |
    The messages the ledger consumes and publishes on Kafka.

    ## payment-settled (consumed)

    The payment system announces every settled payment. The ledger records each one as a transaction
    that debits the settlement account of the payment's currency and credits the merchant's account,
    described as `Payment <paymentId> settled`, and announces it on `transaction-recorded` like any
    other transaction.
    - Each payment is recorded once, however many times it arrives and under whatever event id: the
      ledger deduplicates on `paymentId` (as the idempotency key `payment-settled:<paymentId>`), on
      every instance. The event id is not used.
    - A copy with the same `paymentId` and the same merchant, amount and currency is recognized and
      ignored; one with a different merchant, amount or currency is not recorded and is dead-lettered
      with `IDEMPOTENCY_KEY_REUSED`.
    - The offset is committed after the payment is recorded, so a ledger instance that crashes in
      between gets the message again, and recognizes it.
    - A message the ledger cannot record (malformed, an unknown account, the wrong currency) is
      published unchanged to `payment-settled-dlt`, with the reason in its headers, and the messages
      behind it go on. A payment for an account that is not open yet can be sent again, with the same
      `paymentId`, once the account is open: a refusal is not remembered.
    - Any other failure (the database unavailable, an account locked for too long) is retried, with a
      back-off growing from 2 to 30 seconds, until it succeeds; the messages behind it on the same
      partition wait. Such a message is never dead-lettered.
    - Unknown fields are ignored.
    - The transaction is announced with the `paymentId` as its `correlationId` header.

    ## transaction-recorded (published)

    Every recorded transaction, reversals included, is announced after it is committed, as the same
    `Transaction` the REST API returns for `GET /v1/transactions/{transactionId}` (docs/openapi.yaml).

    What a consumer can rely on:
    - Nothing is missed. The message is written to an outbox table in the database transaction that
      records the transaction, and published after the commit. A committed transaction is announced
      even when the instance that recorded it crashes right after the commit, or Kafka is down for a
      while: its message waits in the outbox until it can be published. A refused transaction is never
      announced.
    - A message may arrive more than once (at-least-once delivery). A send Kafka does not acknowledge
      within 5 seconds is sent again by the next publishing run, while Kafka may still deliver the
      first attempt, so copies are expected after Kafka was slow or unreachable, not only in rare
      cases. A publisher that stops after Kafka acknowledged a message but before it noted it as sent
      sends it again too. Copies are identical (same key, same body). Deduplicate on the transaction
      `id`, which is also the message key.
    - Order: the topic has one partition and one instance publishes at a time, in the order the
      transactions were recorded. Two transactions that touch the same account arrive in the order
      they were applied to it, and a reversal always arrives after the transaction it reverses.
      Transactions with no account in common may arrive in either order. A copy always repeats a
      message that already arrived, so once copies are dropped the order holds.
    - Delay: a transaction is usually announced well within a second of its commit; while Kafka is
      down, messages wait in the outbox and are published, in order, once it is back.
    - Evolution: within version 1, changes are additive only (new optional fields); consumers must
      ignore fields they do not know. A breaking change would get a new topic.
defaultContentType: application/json

servers:
  docker:
    host: kafka:9092
    protocol: kafka
    description: The broker docker-compose.yml starts, inside its network.

channels:
  paymentSettled:
    address: payment-settled
    description: One message for every payment the payment system settled.
    messages:
      paymentSettled:
        $ref: '#/components/messages/PaymentSettled'
    bindings:
      kafka:
        partitions: 2
        bindingVersion: 0.5.0

  paymentSettledDeadLetter:
    address: payment-settled-dlt
    description: |
      The payment-settled messages the ledger could not record, each on the partition it had on
      `payment-settled`.
    messages:
      paymentSettledDeadLetter:
        $ref: '#/components/messages/PaymentSettledDeadLetter'
    bindings:
      kafka:
        partitions: 2
        bindingVersion: 0.5.0

  transactionRecorded:
    address: transaction-recorded
    description: One message for every recorded transaction or reversal.
    messages:
      transactionRecorded:
        $ref: '#/components/messages/TransactionRecorded'
    bindings:
      kafka:
        partitions: 1
        bindingVersion: 0.5.0

operations:
  recordPaymentSettled:
    action: receive
    summary: Record a settled payment
    channel:
      $ref: '#/channels/paymentSettled'
    messages:
      - $ref: '#/channels/paymentSettled/messages/paymentSettled'

  deadLetterPaymentSettled:
    action: send
    summary: Set aside a payment-settled message the ledger could not record
    channel:
      $ref: '#/channels/paymentSettledDeadLetter'
    messages:
      - $ref: '#/channels/paymentSettledDeadLetter/messages/paymentSettledDeadLetter'

  announceTransactionRecorded:
    action: send
    summary: Announce a recorded transaction
    channel:
      $ref: '#/channels/transactionRecorded'
    messages:
      - $ref: '#/channels/transactionRecorded/messages/transactionRecorded'

components:
  schemas:
    PaymentSettled:
      type: object
      required: [eventId, paymentId, merchantAccountId, amount, currency]
      properties:
        eventId:
          type: string
          format: uuid
          description: Identifies this message. The ledger does not use it.
        paymentId:
          type: string
          minLength: 1
          maxLength: 200
          description: Identifies the payment; the ledger records each payment id once.
        merchantAccountId:
          type: string
          format: uuid
          description: The merchant's account, credited with the amount. It must be in the payment's currency.
        amount:
          description: Positive, with no more decimal places than the currency allows.
          allOf:
            - $ref: './openapi.yaml#/components/schemas/Amount'
        currency:
          type: string
          enum: [EUR, USD, JPY]

  messages:
    PaymentSettled:
      name: payment-settled
      title: Payment settled
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentSettled'
      bindings:
        kafka:
          key:
            type: string
            description: The payment id, so copies of one payment share a partition. The ledger does not rely on it.
          bindingVersion: 0.5.0
      examples:
        - name: payment
          summary: A payment of 125.50 EUR settles for Merchant 42
          payload:
            eventId: 6b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
            paymentId: pay-20261110-0042
            merchantAccountId: 0b5e3a52-6d1c-4f0e-9a43-7c1f4f2d8a10
            amount: '125.50'
            currency: EUR

    PaymentSettledDeadLetter:
      name: payment-settled-dead-letter
      title: Payment settled, not recorded
      description: |
        The payment-settled message exactly as it arrived (same key, same value, which may not even be
        JSON), so it can be sent again unchanged. Spring Kafka also adds its `kafka_dlt-original-*` headers:
        the topic, partition, offset, timestamp and timestamp type the message had (the numbers as big-endian
        binary), and the consumer group.
      headers:
        type: object
        required: [errorCode, errorMessage]
        properties:
          errorCode:
            type: string
            enum:
              - MALFORMED_MESSAGE
              - UNKNOWN_ACCOUNT
              - CURRENCY_MISMATCH
              - NON_POSITIVE_AMOUNT
              - TOO_MANY_DECIMAL_PLACES
              - IDEMPOTENCY_KEY_REUSED
            description: |
              `MALFORMED_MESSAGE`: not JSON, a missing field, or a value of the wrong format (an unsupported
              currency included). The other codes are the ledger's own refusals, as in the REST API.
          errorMessage:
            type: string
            description: Names the value at fault.
      payload: {}
      examples:
        - name: unknownAccount
          summary: A payment for an account the ledger does not know
          headers:
            errorCode: UNKNOWN_ACCOUNT
            errorMessage: Account 0b5e3a52-6d1c-4f0e-9a43-7c1f4f2d8a10 does not exist
          payload:
            eventId: 6b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
            paymentId: pay-20261110-0042
            merchantAccountId: 0b5e3a52-6d1c-4f0e-9a43-7c1f4f2d8a10
            amount: '125.50'
            currency: EUR

    TransactionRecorded:
      name: transaction-recorded
      title: Transaction recorded
      contentType: application/json
      headers:
        type: object
        properties:
          correlationId:
            type: string
            maxLength: 200
            description: |
              The `X-Request-Id` of the REST request that recorded the transaction, or the `paymentId` of the
              payment-settled message; the ledger's logs show the same value.
      payload:
        $ref: './openapi.yaml#/components/schemas/Transaction'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: The id of the transaction.
          bindingVersion: 0.5.0
      examples:
        - name: payout
          summary: Merchant 42 is paid out 98.50 EUR, with a fee of 1.50
          payload:
            id: 3f1c9a2e-8b4d-4e6f-9a1b-2c3d4e5f6a7b
            description: Payout to Merchant 42
            currency: EUR
            entries:
              - accountId: 0b5e3a52-6d1c-4f0e-9a43-7c1f4f2d8a10
                direction: DEBIT
                amount: '100.00'
              - accountId: 5f8c2d71-1e4b-4a9e-8b2f-3d6a9c0e7b21
                direction: CREDIT
                amount: '98.50'
              - accountId: 9a1d4e63-2b7f-4c8a-a5e0-6f3b8d2c1e94
                direction: CREDIT
                amount: '1.50'
            recordedAt: '2026-11-10T14:30:00.123456Z'
